name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-candidate
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner identity
        run: |
          echo "Runner: $RUNNER_NAME / $RUNNER_OS / $RUNNER_ARCH"
          uname -a
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:all
        env:
          CSB_PLAYWRIGHT_OUTPUT: ${{ runner.temp }}/convex-sandbox-e2e
      - name: Prepare candidate without registry publication
        run: pnpm release:candidate "$RUNNER_TEMP/convex-sandbox-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-candidate
          path: ${{ runner.temp }}/convex-sandbox-candidate
          if-no-files-found: error
          retention-days: 14
      - name: Save browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-example-tests
          path: ${{ runner.temp }}/convex-sandbox-e2e
          if-no-files-found: ignore
          retention-days: 7
  attest:
    needs: build
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # No checkout or repository scripts run with the attestation token.
      - uses: actions/download-artifact@v4
        with:
          name: baseline-candidate
          path: ${{ runner.temp }}/convex-sandbox-candidate
      - name: Attest candidate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/convex-sandbox-candidate/*.tgz
            ${{ runner.temp }}/convex-sandbox-candidate/candidate.json
          create-storage-record: false
