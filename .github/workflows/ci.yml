name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner identity
        run: |
          echo "Runner: $RUNNER_NAME / $RUNNER_OS / $RUNNER_ARCH"
          uname -a
      - name: Install browser for example checks
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:all
        env:
          CSB_PLAYWRIGHT_OUTPUT: ${{ runner.temp }}/convex-sandbox-e2e
      - name: Save example test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-test-results
          path: ${{ runner.temp }}/convex-sandbox-e2e
          if-no-files-found: ignore
          retention-days: 7
